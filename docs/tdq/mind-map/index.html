<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sơ đồ tổng</title>
<style>
* { box-sizing: border-box; }
:root {
  --bg: #fbfbf9; --fg: #1c1c1a; --muted: #6b6b64; --border: #d8d8d2;
  --card: #eceae4; --err: #a32020; --accent: #1d5f8a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16171a; --fg: #e8e8e4; --muted: #9a9a92; --border: #33343a;
    --card: #23252b; --err: #e08a8a; --accent: #7ab6dd;
  }
}
:root[data-theme="dark"] {
  --bg: #16171a; --fg: #e8e8e4; --muted: #9a9a92; --border: #33343a;
  --card: #23252b; --err: #e08a8a; --accent: #7ab6dd;
}
body {
  margin: 0; padding: 24px 18px 60px; background: var(--bg); color: var(--fg);
  font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 900px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 6px; }
h2, h3 { font-size: 15px; margin: 20px 0 8px; }
.nhanh { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
button { font: inherit; padding: 6px 12px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; }
[hidden] { display: none !important; }
ol.steps, ul.calls-list, ul.depends { list-style: none; margin: 0; padding-left: 0; }
li.step { border-left: 2px solid var(--border); padding: 6px 0 6px 12px; margin-bottom: 2px; }
li.step.is-error { border-left-color: var(--err); }
.err { color: var(--err); font-size: 12px; }
.muted, .canh-bao { color: var(--muted); }
.canh-bao { border: 1px solid var(--border); background: var(--card); border-radius: 6px;
  padding: 8px 12px; font-size: 13px; margin: 0 0 16px; }
code { background: var(--card); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
code.dim, .dim { opacity: .55; }
.calls-list li { padding: 2px 0; font-size: 13px; }
.loc { color: var(--accent); font-weight: 600; margin-right: 4px; }
figure.call-fig { margin: 10px 0 4px; }
figure.call-fig svg { max-width: 100%; height: auto; display: block; }
figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
.step-detail { border-top: 1px solid var(--border); padding: 10px 0; }
details summary { cursor: pointer; color: var(--accent); }

section { margin-bottom: 28px; }
.cay-nhanh, .cay-nhanh ul { list-style: none; margin: 0; padding-left: 16px; }
.cay-nhanh { padding-left: 0; }
.cay-nhanh > li { margin-bottom: 6px; }
.cay-nhanh a { color: var(--accent); text-decoration: none; }
.cay-nhanh a:hover, .cay-nhanh a:focus-visible { text-decoration: underline; }
.grid-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px;
  padding: 12px; margin: 8px 0; }
.grid-fig { margin: 0; }
.grid-fig svg { display: block; height: auto; }
.danh-sach-canh { list-style: none; padding-left: 0; margin: 8px 0 0; font-size: 13px; }
.danh-sach-canh li { padding: 2px 0; }
</style>
</head>
<body>
<main>
<header>
<h1>Sơ đồ tổng</h1>
</header>
<section id="cay-nhanh"><h2>Cây nhánh</h2><ul class="cay-nhanh"><li><strong>Thương mại</strong><ul><li>Mua hàng<ul><li><a href="mua-hang.html">Mua hàng</a></li></ul></li></ul></li><li><strong>Tài khoản</strong><ul><li>Đăng nhập<ul><li><a href="dang-nhap.html">Đăng nhập</a></li></ul></li></ul></li><li><em>Chưa gắn nhánh</em><ul><li><a href="vi-du-login.html">Đăng nhập</a></li></ul></li></ul></section>
<section id="luoi-phu-thuoc"><h2>Lưới phụ thuộc</h2><div class="grid-wrap"><figure class="grid-fig"><svg viewBox="0 0 460 72" role="img" aria-label="Lưới phụ thuộc giữa các feature — mỗi mũi tên trỏ từ feature phụ thuộc sang feature nó cần"><defs><marker id="seotenmuiten-tong" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/></marker></defs><line x1="260" y1="13.0" x2="190" y2="13.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#seotenmuiten-tong)"/><rect x="0" y="0" width="190" height="26" rx="4" fill="none" stroke="currentColor"/><text x="8" y="17.0" font-size="12" fill="currentColor">dang-nhap</text><rect x="0" y="36" width="190" height="26" rx="4" fill="none" stroke="currentColor"/><text x="8" y="53.0" font-size="12" fill="currentColor">vi-du-login</text><rect x="260" y="0" width="190" height="26" rx="4" fill="none" stroke="currentColor"/><text x="268" y="17.0" font-size="12" fill="currentColor">mua-hang</text></svg><figcaption>Lưới phụ thuộc giữa các feature — mỗi mũi tên trỏ từ feature phụ thuộc sang feature nó cần.</figcaption></figure></div><ul class="danh-sach-canh"><li><code>mua-hang</code> &rarr; <code>dang-nhap</code> — cần token phiên do đăng nhập phát ra</li></ul></section>
</main>
</body>
</html>
