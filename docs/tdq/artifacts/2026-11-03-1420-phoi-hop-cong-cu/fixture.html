<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kiểm tệp local</title>
<style>
/* Single-column test bench, local bytes only. */
:root{--bg:#f5f8fa;--fg:#162c3b;--accent:#075d82;--line:#a9bdc8;--display:Georgia,serif;--body:system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14212b;--fg:#e4edf2;--accent:#87d2f0;--line:#627f90;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14212b;--fg:#e4edf2;--accent:#87d2f0;--line:#627f90;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}main{max-width:640px;margin:auto;display:grid;gap:18px}h1{font:32px var(--display);margin:0}p{margin:0}input{max-width:100%}a{color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}output{overflow-wrap:anywhere;border-block:1px solid var(--line);padding-block:16px}
</style></head><body><main><h1>Kiểm tệp local</h1><p>Fixture nghiệm thu. Tệp chỉ đọc trong browser; không gửi tới server.</p><label for="attachment">Chọn tệp mẫu</label><input id="attachment" type="file"><output id="status" aria-live="polite">Chưa chọn tệp</output><a id="download" hidden download="tdq-routing-fixture-result.txt">Tải bản sao đã kiểm</a></main>
<script>
const input=document.getElementById('attachment'),status=document.getElementById('status'),link=document.getElementById('download');let url;
input.addEventListener('change',async()=>{link.hidden=true;const file=input.files[0];if(!file){status.textContent='Chưa chọn tệp';return;}try{const bytes=await file.arrayBuffer();const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([bytes],{type:'text/plain;charset=utf-8'}));link.href=url;link.hidden=false;status.textContent=file.name+' | '+file.size+' bytes | SHA-256 '+digest;status.dataset.sha256=digest;}catch(error){status.textContent='Không đọc được tệp: '+error.message;}});
</script></body></html>
